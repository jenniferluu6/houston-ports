<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Houston — Container Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
  :root{
    --ink:#1f1f1f; --muted:#6f6e66; --faint:#9a998f;
    --paper:#ffffff; --panel:#faf9f4; --panel-2:#f2f0e9; --hair:#e6e4da; --dim:#b9b7ae;
    --accent:#1e1a4b;
    --lane-india:#9e2b0e; --lane-med:#c6821a; --lane-nsa:#4c6b1f; --lane-atl:#1e1a4b; --lane-pac:#226e7c;
    --disp:"Barlow Semi Condensed",system-ui,sans-serif;
    --sans:"Barlow",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);
    -webkit-font-smoothing:antialiased;display:flex;overflow:hidden}

  /* ---------- sidebar ---------- */
  aside{width:340px;flex:0 0 340px;height:100%;background:var(--panel);border-right:1px solid var(--hair);
    display:flex;flex-direction:column;overflow:hidden}
  .brand{padding:22px 22px 16px;border-bottom:1px solid var(--hair)}
  .brand .kicker{font-family:var(--sans);font-weight:600;font-size:.66rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--muted)}
  .brand h1{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.005em;
    font-size:2.35rem;line-height:.92;margin:.18em 0 .18em}
  .brand p{font-size:.82rem;color:var(--muted);margin:0;line-height:1.45}

  .section{padding:16px 22px;border-bottom:1px solid var(--hair)}
  .section .lbl{font-weight:600;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faint);display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .section .lbl button{font-family:var(--sans);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);background:none;border:0;cursor:pointer;padding:0;font-weight:600;visibility:hidden}
  .section .lbl button.show{visibility:visible}

  .lanes{display:flex;flex-direction:column;gap:2px}
  .lane-chip{display:flex;align-items:center;gap:10px;padding:6px 6px;border:0;background:none;cursor:pointer;
    font-family:var(--sans);font-size:.86rem;color:var(--ink);text-align:left;border-radius:4px;
    transition:background .12s,opacity .12s}
  .lane-chip:hover{background:var(--panel-2)}
  .lane-chip .rail{width:22px;height:4px;border-radius:2px;flex:0 0 auto}
  .lane-chip .nm{flex:1;font-weight:500}
  .lane-chip .ct{font-size:.72rem;color:var(--faint);font-variant-numeric:tabular-nums}
  .lane-chip.off{opacity:.34}
  .lane-chip.off .rail{background:var(--dim)!important}

  .list{flex:1;overflow-y:auto;padding:6px 12px 20px}
  .grp{margin-top:10px}
  .grp .gh{display:flex;align-items:center;gap:8px;padding:6px 10px 4px;font-size:.64rem;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .grp .gh .rail{width:16px;height:4px;border-radius:2px}
  .row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:7px 10px;
    border-radius:5px;cursor:pointer;transition:background .1s}
  .row:hover{background:var(--panel-2)}
  .row .pin{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim);flex:0 0 auto}
  .row.pinned .pin{border-color:transparent}
  .row .info{min-width:0}
  .row .nm{font-weight:600;font-size:.84rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .sub{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .row .teu{font-size:.72rem;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
  .row.pinned{background:var(--panel-2)}

  .foot{padding:12px 22px;border-top:1px solid var(--hair);font-size:.66rem;color:var(--faint);line-height:1.55}
  .foot a{color:var(--muted)}

  /* ---------- map ---------- */
  #map{flex:1;height:100%}
  .maplibregl-ctrl-attrib{font-size:10px}

  .tip{position:fixed;z-index:20;pointer-events:none;max-width:320px;background:var(--paper);
    border:1px solid var(--ink);padding:10px 12px;opacity:0;transform:translateY(3px);transition:opacity .1s;
    box-shadow:3px 3px 0 rgba(31,31,31,.14)}
  .tip.on{opacity:1;transform:none}
  .tip .t{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:.98rem;line-height:1;
    display:flex;align-items:center;gap:8px}
  .tip .t .sw{width:20px;height:5px;border-radius:2px;flex:0 0 auto}
  .tip .m{font-size:.68rem;color:var(--muted);margin:5px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--hair);
    font-variant-numeric:tabular-nums}
  .tip .r{font-size:.68rem;line-height:1.55;color:var(--ink)}

  .hlabel{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.05em;
    color:var(--ink);background:rgba(255,255,255,.72);padding:1px 5px;transform:translate(6px,-50%);white-space:nowrap}

  @media (max-width:760px){
    body{flex-direction:column;overflow:auto}
    aside{width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--hair)}
    .list{max-height:230px}
    #map{height:62vh;min-height:360px}
  }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <div class="kicker">Port Houston</div>
    <h1>Container<br>Network</h1>
    <p>19 liner services along their sea-lane routes. Schedule rev. January 2026.</p>
  </div>

  <div class="section">
    <div class="lbl">Trade lanes <button id="reset-lanes">Reset</button></div>
    <div class="lanes" id="lanes"></div>
  </div>

  <div class="lbl" style="padding:14px 22px 0;color:var(--faint)">
    Services <button id="clear-pins" style="visibility:hidden;font-family:var(--sans);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:none;border:0;cursor:pointer;font-weight:600">Clear pins</button>
  </div>
  <div class="list" id="list"></div>

  <div class="foot">
    Sea-lane routes (searoute), not vessel tracks · Base: <a href="https://carto.com/">CARTO</a> Positron.
    <a href="https://onearchitecture.nl/">ONE Architecture &amp; Urbanism</a>.
  </div>
</aside>

<div id="map"></div>
<div class="tip" id="tip"></div>

<script>
const LANE = {"India/MiddleEast":"#9e2b0e","Med":"#c6821a","N/S America":"#4c6b1f",
              "Trans-Atlantic":"#1e1a4b","Trans-Pacific":"#226e7c"};
const PINPALETTE = ["#1e1a4b","#9e2b0e","#226e7c","#c6821a","#4c6b1f","#7a2f6b"];
const laneMatch = ["match",["get","lane"],
  "India/MiddleEast","#9e2b0e","Med","#c6821a","N/S America","#4c6b1f",
  "Trans-Atlantic","#1e1a4b","Trans-Pacific","#226e7c","#888888"];

const map = new maplibregl.Map({
  container:"map",
  style:"https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
  center:[-28,22], zoom:1.35, minZoom:1, maxZoom:9, attributionControl:true,
  renderWorldCopies:true
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-right");

let SERVICES=[];                      // properties of each service feature
const activeLanes=new Set();          // empty = all
const pinned=new Map();               // svc_id -> color
let hovered=null;

function loadError(msg){
  const b=document.createElement("div");
  b.style.cssText="position:absolute;top:16px;left:16px;right:16px;max-width:420px;z-index:5;background:#fff;"+
    "border:1px solid #1f1f1f;padding:12px 14px;font:600 13px/1.5 Barlow,system-ui,sans-serif;color:#9e2b0e";
  b.textContent="Couldn't load route data ("+msg+"). Serve this folder over http with data/ next to index.html.";
  document.getElementById("map").appendChild(b);
}
map.on("load", async ()=>{
 try{
  map.setProjection({type:"mercator"});   // flat map; renderWorldCopies wraps it continuously east-west
  const grab=async u=>{const r=await fetch(u); if(!r.ok) throw new Error(u.split("/").pop()+" "+r.status); return r.json();};
  const [routes, ports] = await Promise.all([grab("./data/routes.geojson"), grab("./data/ports.geojson")]);
  SERVICES = routes.features.map(f=>f.properties).sort((a,b)=>a.name.localeCompare(b.name));

  map.addSource("routes",{type:"geojson",data:routes});
  map.addSource("ports",{type:"geojson",data:ports});

  map.addLayer({id:"casing",type:"line",source:"routes",
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":"#ffffff",
      "line-width":["+",["coalesce",["feature-state","w"],2.4],2.4],
      "line-opacity":["coalesce",["feature-state","op"],0.9]}});
  map.addLayer({id:"routes",type:"line",source:"routes",
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":["coalesce",["feature-state","col"],laneMatch],
      "line-width":["coalesce",["feature-state","w"],2.4],
      "line-opacity":["coalesce",["feature-state","op"],0.9]}});

  // transparent wide layer for reliable hover/click on thin lines (kept below the port dots)
  map.addLayer({id:"routes-hit",type:"line",source:"routes",
    paint:{"line-color":"#000","line-opacity":0,"line-width":14}});

  map.addLayer({id:"ports",type:"circle",source:"ports",filter:["!",["get","is_houston"]],
    paint:{"circle-radius":["interpolate",["linear"],["zoom"],1,1.5,4,2.8,7,4.5],
      "circle-color":"#1f1f1f","circle-opacity":0.55,
      "circle-stroke-width":0.6,"circle-stroke-color":"#ffffff"}});
  map.addLayer({id:"houston",type:"circle",source:"ports",filter:["get","is_houston"],
    paint:{"circle-radius":["interpolate",["linear"],["zoom"],1,4,5,7],
      "circle-color":"#1e1a4b","circle-stroke-width":2,"circle-stroke-color":"#ffffff"}});

  // Houston label
  const h = ports.features.find(f=>f.properties.is_houston);
  if(h){
    const el=document.createElement("div"); el.className="hlabel"; el.textContent="Houston";
    new maplibregl.Marker({element:el,anchor:"left"}).setLngLat(h.geometry.coordinates).addTo(map);
  }

  buildLanes(); buildList(); recompute();
  wireMapEvents();
 }catch(err){ console.error(err); loadError(err.message); }
});

/* ---------- state application ---------- */
const shownByFilter = lane => activeLanes.size===0 || activeLanes.has(lane);
function desired(p){
  const svc=p.svc_id, lane=p.lane, laneCol=LANE[lane];
  if(pinned.has(svc)) return {col:pinned.get(svc), w:5, op:1};
  if(svc===hovered)   return {col:laneCol, w:5, op:1};
  if(!shownByFilter(lane)) return {col:laneCol, w:0, op:0};        // lane filtered out -> hidden
  if(pinned.size>0)   return {col:"#b9b7ae", w:1.2, op:0.14};      // ghost the rest while comparing pins
  return {col:laneCol, w:2.4, op:0.9};
}
function recompute(){
  SERVICES.forEach(p=>map.setFeatureState({source:"routes",id:p.svc_id}, desired(p)));
  syncUI();
}

/* ---------- sidebar: lanes ---------- */
function counts(){const c={};SERVICES.forEach(p=>c[p.lane]=(c[p.lane]||0)+1);return c;}
function buildLanes(){
  const c=counts(), box=document.getElementById("lanes");
  Object.keys(LANE).forEach(lane=>{
    const b=document.createElement("button"); b.className="lane-chip"; b.dataset.lane=lane;
    b.innerHTML='<span class="rail" style="background:'+LANE[lane]+'"></span>'+
      '<span class="nm">'+lane+'</span><span class="ct">'+(c[lane]||0)+'</span>';
    b.onclick=()=>{ activeLanes.has(lane)?activeLanes.delete(lane):activeLanes.add(lane); pinned.clear(); recompute(); };
    box.appendChild(b);
  });
  document.getElementById("reset-lanes").onclick=()=>{activeLanes.clear();recompute();};
}

/* ---------- sidebar: service list ---------- */
function buildList(){
  const list=document.getElementById("list");
  Object.keys(LANE).forEach(lane=>{
    const rows=SERVICES.filter(p=>p.lane===lane); if(!rows.length)return;
    const g=document.createElement("div"); g.className="grp";
    g.innerHTML='<div class="gh"><span class="rail" style="background:'+LANE[lane]+'"></span>'+lane+'</div>';
    rows.forEach(p=>{
      const r=document.createElement("div"); r.className="row"; r.dataset.svc=p.svc_id;
      r.innerHTML='<span class="pin"></span><span class="info"><span class="nm">'+p.name+'</span>'+
        '<span class="sub">'+p.n_calls+' calls · '+p.terminal+'</span></span>'+
        '<span class="teu">'+p.teu.toLocaleString()+'</span>';
      r.onmouseenter=()=>setHover(p.svc_id);
      r.onmouseleave=()=>setHover(null);
      r.onclick=()=>togglePin(p.svc_id);
      g.appendChild(r);
    });
    list.appendChild(g);
  });
  document.getElementById("clear-pins").onclick=()=>{pinned.clear();recompute();};
}

function togglePin(svc){
  if(pinned.has(svc)){ pinned.delete(svc); }
  else{
    const used=new Set(pinned.values());
    const col=PINPALETTE.find(c=>!used.has(c)) || PINPALETTE[pinned.size%PINPALETTE.length];
    pinned.set(svc,col);
  }
  recompute();
}
function setHover(svc){ if(svc===hovered)return; hovered=svc; recompute(); }

/* ---------- reflect state in the sidebar ---------- */
function syncUI(){
  document.querySelectorAll(".lane-chip").forEach(b=>{
    const on = activeLanes.size===0 || activeLanes.has(b.dataset.lane);
    b.classList.toggle("off", !on);
  });
  document.getElementById("reset-lanes").classList.toggle("show", activeLanes.size>0);
  document.getElementById("clear-pins").style.visibility = pinned.size>0 ? "visible":"hidden";
  document.querySelectorAll(".row").forEach(r=>{
    const svc=r.dataset.svc, isPin=pinned.has(svc);
    r.classList.toggle("pinned", isPin);
    r.querySelector(".pin").style.background = isPin ? pinned.get(svc) : "transparent";
  });
}

/* ---------- map events ---------- */
const tip=document.getElementById("tip");
function showTip(html,e){tip.innerHTML=html;tip.classList.add("on");moveTip(e);}
function moveTip(e){const pad=16;let x=e.originalEvent.clientX+pad,y=e.originalEvent.clientY+pad;
  const r=tip.getBoundingClientRect();
  if(x+r.width>innerWidth-8)x=e.originalEvent.clientX-r.width-pad;
  if(y+r.height>innerHeight-8)y=e.originalEvent.clientY-r.height-pad;
  tip.style.left=x+"px";tip.style.top=y+"px";}
function hideTip(){tip.classList.remove("on");}

function routeTipHTML(p){
  return '<div class="t"><span class="sw" style="background:'+LANE[p.lane]+'"></span>'+p.name+'</div>'+
    '<div class="m">'+p.lane+' · '+Number(p.teu).toLocaleString()+' TEU avg · '+p.terminal+' · '+p.n_calls+' calls</div>'+
    '<div class="r">'+p.rotation+'</div>';
}
function portTipHTML(p){
  return '<div class="t" style="font-size:.82rem">'+p.name+'</div><div class="m" style="border:0;margin-bottom:0">'+
    p.n_service+' service'+(p.n_service>1?'s':'')+'</div>';
}
function wireMapEvents(){
  map.on("mousemove","routes-hit",e=>{const p=e.features[0].properties;
    if(!shownByFilter(p.lane))return;
    map.getCanvas().style.cursor="pointer";setHover(p.svc_id);showTip(routeTipHTML(p),e);});
  map.on("mouseleave","routes-hit",()=>{map.getCanvas().style.cursor="";setHover(null);hideTip();});
  // tap/click: works where mousemove is absent (touch). Shows info, traces, and pins.
  map.on("click","routes-hit",e=>{const p=e.features[0].properties;
    if(!shownByFilter(p.lane))return;
    setHover(p.svc_id);showTip(routeTipHTML(p),e);togglePin(p.svc_id);});

  ["ports","houston"].forEach(l=>{
    map.on("mousemove",l,e=>{map.getCanvas().style.cursor="pointer";showTip(portTipHTML(e.features[0].properties),e);});
    map.on("mouseleave",l,()=>{map.getCanvas().style.cursor="";hideTip();});
    map.on("click",l,e=>showTip(portTipHTML(e.features[0].properties),e));
  });
  // tap on empty map dismisses the tooltip (mobile, where mouseleave never fires)
  map.on("click",e=>{
    if(!map.queryRenderedFeatures(e.point,{layers:["routes-hit","ports","houston"]}).length){hideTip();setHover(null);}
  });
}
</script>
</body>
</html>
